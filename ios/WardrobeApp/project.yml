name: WardrobeApp
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: HZJCSBT93X
    CODE_SIGN_STYLE: Automatic
targets:
  WardrobeApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/WardrobeApp
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Wardrobe
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: Allow Wardrobe to choose clothing photos for upload.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salolupo.wardrobe
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
schemes:
  WardrobeApp:
    build:
      targets:
        WardrobeApp: all
    run:
      config: Debug
