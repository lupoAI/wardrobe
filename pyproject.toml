[project]
name = "wardrobe"
version = "0.1.0"
description = "Local wardrobe catalog with image metadata and embeddings"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.0.0",
  "numpy>=1.26.0"
]

[project.scripts]
wardrobe = "wardrobe.cli:main"

[tool.setuptools.packages.find]
include = ["wardrobe*"]
exclude = ["data*", "incoming*", "tests*"]
